<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MyTask</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root {
  --accent: #3b82f6;
  --bg: #0f172a;
  --bg-elevated: #1e293b;
  --bg-card: #1e293b;
  --bg-sub: #172033;
  --border: #334155;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
}

/* ---------- Header ---------- */

header.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
  flex-shrink: 0;
}

.logo { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.logo .accent { color: var(--accent); }

.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  max-width: 60%;
}

.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-dot.pending { background: var(--danger); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.user-email {
  font-size: 13px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Main / task list ---------- */

main {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 100px;
  -webkit-overflow-scrolling: touch;
}

.empty-state { text-align: center; color: var(--text-dim); margin-top: 60px; font-size: 14px; }

.task {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}

.task-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 14px;
  cursor: pointer;
}
.task-row:active { background: rgba(255,255,255,0.03); }

.task-main { flex: 1; min-width: 0; }

.task-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  word-break: break-word;
}

/* riga 2: data + progresso + cestino */
.task-line2 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.task-line2 .date-value {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-line2 .date-value.no-date { opacity: 0.6; font-style: italic; }

/* riga 3: prossimo passo, troncato */
.task-line3 {
  margin-top: 3px;
  font-size: 12.5px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.expand-arrow {
  color: var(--text-dim);
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 3px;
  transition: transform 0.15s ease;
}
.expand-arrow.open { transform: rotate(90deg); }

.progress-badge {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(59,130,246,0.12);
  padding: 3px 0;
  border-radius: 999px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
}
.progress-badge.complete { color: var(--success); background: rgba(34,197,94,0.12); }

.task-delete-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 4px 2px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.task-delete-btn svg, .subtask-delete-btn svg { width: 17px; height: 17px; }

/* ---------- Subtasks ---------- */

.subtasks {
  border-top: 1px solid var(--border);
  background: var(--bg-sub);
  padding: 4px 8px;
}

.subtask-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.subtask-row:last-of-type { border-bottom: none; }
.subtask-row.draggable { cursor: grab; }
.subtask-row.drag-over { border-top: 2px solid var(--accent); }

.checkbox {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.checkbox.checked { background: var(--accent); border-color: var(--accent); }
.checkbox.checked::after { content: "✓"; color: white; font-size: 12px; font-weight: 700; }

.subtask-body { flex: 1; min-width: 0; }
.subtask-title { font-size: 14px; line-height: 1.3; word-break: break-word; }
.subtask-title.done { color: var(--text-dim); text-decoration: line-through; }

.subtask-meta { display: flex; gap: 8px; margin-top: 3px; align-items: center; }

.date-badge {
  font-size: 11.5px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255,255,255,0.05);
}
.date-badge.empty { opacity: 0.55; font-style: italic; }

.chi-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--bg);
  background: var(--accent);
  padding: 1px 6px;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.chi-badge.empty { background: var(--border); color: var(--text-dim); font-weight: 500; }

.subtask-delete-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 4px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

.drag-handle {
  color: var(--text-dim);
  opacity: 0.5;
  font-size: 13px;
  flex-shrink: 0;
  cursor: grab;
  padding: 0 2px;
}

.add-subtask-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 13px;
  padding: 9px 8px;
  cursor: pointer;
  width: 100%;
  text-align: left;
}

/* ---------- Composer ---------- */

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.composer form {
  display: flex;
  gap: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 6px 6px 14px;
}
.composer input[type="text"] { flex: 1; background: none; border: none; color: var(--text); font-size: 15px; outline: none; }
.composer input::placeholder { color: var(--text-dim); }
.composer button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ---------- Modal ---------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-backdrop.hidden { display: none; }

.modal {
  background: var(--bg-elevated);
  width: 100%;
  max-width: 640px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-height: 85vh;
  overflow-y: auto;
}

.modal h2 { margin: 0 0 16px; font-size: 18px; }
.modal label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 6px; }
.modal input[type="email"],
.modal input[type="password"],
.modal input[type="date"],
.modal select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.modal .primary-btn {
  width: 100%;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  font-weight: 600;
  margin-top: 18px;
  cursor: pointer;
}
.modal .secondary-btn {
  width: 100%;
  background: none;
  color: var(--text-dim);
  border: none;
  padding: 10px;
  font-size: 13px;
  margin-top: 6px;
  cursor: pointer;
}
.modal .danger-btn {
  width: 100%;
  background: none;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  margin-top: 18px;
  cursor: pointer;
}
.modal .close-x { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
.form-error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
.form-error.visible { display: block; }
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.settings-row:last-of-type { border-bottom: none; }

.chi-options { display: flex; gap: 8px; margin-top: 4px; }
.chi-options button {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.chi-options button.selected { background: var(--accent); border-color: var(--accent); color: white; }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="logo">My<span class="accent">Task</span></div>
    <div class="user-pill" id="userPill">
      <span class="sync-dot" id="syncDot"></span>
      <span class="user-email" id="userEmail">accedi</span>
    </div>

  <main id="taskList">

      <div class="settings-row"><span>Stato sync</span><span id="settingsSyncStatus" style="color:var(--text-dim)"></span></div>

      <h2 id="subtaskModalTitle">Nuovo sottotask</h2>
      <label for="subtaskTitleInput">Titolo</label>
      <input type="text" id="subtaskTitleInput" placeholder="es. Check prezzi di vendita attuali">
      <label for="subtaskDateInput">Data (opzionale)</label>
      <input type="date" id="subtaskDateInput">
      <label>Chi</label>
      <div class="chi-options" id="chiOptions">
        <button type="button" data-chi="M">M</button>
        <button type="button" data-chi="C">C</button>
        <button type="button" data-chi="M+C">M+C</button>
        <button type="button" data-chi="">—</button>
      </div>
      <button class="primary-btn" id="subtaskSaveBtn">Salva</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// MyTask — logica applicativa
// Pattern riusati dal playbook CaliMat: localStorage-first, coda di sync con
// retry, ID generati lato client, indicatore di stato nel pill in alto a destra.

const SUPABASE_URL = 'https://edlvmkjctzhqoswpppds.supabase.co/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkbHZta2pjdHpocW9zd3BwcGRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjEyMDEsImV4cCI6MjA5NjczNzIwMX0.Oq0TyYWG4LotZhH57LQtklUdVho_kQ15KlSs8KGO2AM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LS_TASKS = 'mt_tasks';
const LS_PENDING_SYNC = 'mt_pending_sync';
const MAX_RETRIES = 8;

let currentUser = null;
let tasks = [];
let authMode = 'login';
let expanded = new Set();      // id dei task padre attualmente espansi
let subtaskModalContext = null; // { mode: 'new'|'edit', parentId, taskId, selectedChi }
let dragState = null;           // { parentId, draggedId }

const TRASH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 6h18"></path>
  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
  <line x1="10" y1="11" x2="10" y2="17"></line>
  <line x1="14" y1="11" x2="14" y2="17"></line>
</svg>`;

// ================= LOCALSTORAGE =================

function loadTasksFromLocal() {
  try { tasks = JSON.parse(localStorage.getItem(LS_TASKS)) || []; }
  catch { tasks = []; }
}
function saveTasksToLocal() { localStorage.setItem(LS_TASKS, JSON.stringify(tasks)); }

function loadPendingQueue() {
  try { return JSON.parse(localStorage.getItem(LS_PENDING_SYNC)) || []; }
  catch { return []; }
}
function savePendingQueue(queue) {
  localStorage.setItem(LS_PENDING_SYNC, JSON.stringify(queue));
  updateSyncIndicator();
}
function enqueueSync(fnName, args) {
  const queue = loadPendingQueue();
  queue.push({ fn: fnName, args, ts: Date.now(), attempts: 0 });
  savePendingQueue(queue);
}

// ================= SYNC INDICATOR =================

function updateSyncIndicator(state) {
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  const pending = loadPendingQueue().length;
  dot.classList.remove('syncing', 'pending');
  if (state === 'syncing') dot.classList.add('syncing');
  else if (pending > 0) dot.classList.add('pending');

  const settingsStatus = document.getElementById('settingsSyncStatus');
  if (settingsStatus) {
    settingsStatus.textContent = pending > 0 ? `${pending} modifiche in coda` : 'Tutto sincronizzato';
  }
}

// ================= DB (con coda offline) =================

function taskToRow(task) {
  return {
    id: task.id,
    user_id: currentUser.id,
    parent_id: task.parent_id,
    title: task.title,
    notes: task.notes ?? null,
    chi: task.chi ?? null,
    done: task.done,
    position: task.position,
    due_date: task.due_date ?? null,
  };
}

async function saveTaskToDB(task) {
  try {
    const { error } = await sb.from('Task_items').upsert(taskToRow(task));
    if (error) throw error;
    updateSyncIndicator();
  } catch (err) {
    console.warn('saveTaskToDB fallita, accodo:', err.message);
    enqueueSync('saveTaskToDB', [task]);
  }
}

async function deleteTaskToDB(taskId) {
  try {
    const { error } = await sb.from('Task_items').delete().eq('id', taskId);
    if (error) throw error;
    updateSyncIndicator();
  } catch (err) {
    console.warn('deleteTaskToDB fallita, accodo:', err.message);
    enqueueSync('deleteTaskToDB', [taskId]);
  }
}

async function callRaw(fnName, args) {
  if (fnName === 'saveTaskToDB') return await sb.from('Task_items').upsert(taskToRow(args[0]));
  if (fnName === 'deleteTaskToDB') return await sb.from('Task_items').delete().eq('id', args[0]);
  return { error: new Error('funzione sconosciuta: ' + fnName) };
}

async function flushPendingSync() {
  if (!currentUser || !navigator.onLine) return;
  let queue = loadPendingQueue();
  if (queue.length === 0) return;
  updateSyncIndicator('syncing');
  try { await sb.auth.refreshSession(); } catch {}

  const remaining = [];
  for (const item of queue) {
    if (item.attempts >= MAX_RETRIES) { remaining.push(item); continue; }
    try {
      const { error } = await callRaw(item.fn, item.args);
      if (error) throw error;
    } catch {
      item.attempts += 1;
      remaining.push(item);
    }
  }
  savePendingQueue(remaining);
  updateSyncIndicator();
}

async function fetchTasksFromDB() {
  if (!currentUser || !navigator.onLine) return;
  try {
    const { data, error } = await sb.from('Task_items').select('*');
    if (error) throw error;
    tasks = data.map(r => ({
      id: r.id, parent_id: r.parent_id, title: r.title, notes: r.notes,
      chi: r.chi, done: r.done, position: r.position, due_date: r.due_date,
    }));
    saveTasksToLocal();
    render();
  } catch (err) {
    console.warn('fetchTasksFromDB fallita, resto sui dati locali:', err.message);
  }
}

// ================= LOGICA TASK / SOTTOTASK =================

function addParentTask(title) {
  const siblings = tasks.filter(t => t.parent_id === null);
  const task = {
    id: crypto.randomUUID(), parent_id: null, title: title.trim(),
    notes: null, chi: null, done: false, position: siblings.length, due_date: null,
  };
  tasks.push(task);
  saveTasksToLocal(); render(); saveTaskToDB(task);
}

function addOrUpdateSubtask({ id, parentId, title, due_date, chi }) {
  if (id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.title = title; t.due_date = due_date || null; t.chi = chi || null;
    saveTasksToLocal(); render(); saveTaskToDB(t);
  } else {
    const siblings = tasks.filter(t => t.parent_id === parentId);
    const task = {
      id: crypto.randomUUID(), parent_id: parentId, title,
      notes: null, chi: chi || null, done: false,
      position: siblings.length, due_date: due_date || null,
    };
    tasks.push(task);
    saveTasksToLocal(); render(); saveTaskToDB(task);
  }
}

function toggleSubtaskDone(taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  saveTasksToLocal(); render(); saveTaskToDB(task);
}

function deleteTask(taskId) {
  const idsToDelete = new Set([taskId]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const t of tasks) {
      if (idsToDelete.has(t.parent_id) && !idsToDelete.has(t.id)) { idsToDelete.add(t.id); changed = true; }
    }
  }
  tasks = tasks.filter(t => !idsToDelete.has(t.id));
  saveTasksToLocal(); render(); deleteTaskToDB(taskId);
}

// ---- calcolo progresso / prossima data / prossimo passo di un task padre ----

function getSubtasks(parentId) {
  return tasks.filter(t => t.parent_id === parentId);
}

function orderSubtasks(subs) {
  // con data, ordinate per data crescente; senza data, dopo, ordinate per position (drag manuale)
  const withDate = subs.filter(s => s.due_date).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const withoutDate = subs.filter(s => !s.due_date).sort((a, b) => a.position - b.position);
  return [...withDate, ...withoutDate];
}

function computeParentInfo(parentId) {
  const subs = getSubtasks(parentId);
  const total = subs.length;
  const doneCount = subs.filter(s => s.done).length;
  const pending = orderSubtasks(subs.filter(s => !s.done));
  const next = pending[0] || null;
  return {
    total, doneCount,
    nextDate: next ? next.due_date : null,
    nextStep: next ? next.title : (total > 0 ? 'Completato' : null),
  };
}

function formatDate(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// ================= RENDER =================

function render() {
  const listEl = document.getElementById('taskList');

  if (!currentUser) {
    listEl.innerHTML = '<div class="empty-state">Accedi per vedere e sincronizzare i tuoi task.</div>';
    return;
  }

  const rootTasks = tasks.filter(t => t.parent_id === null).map(t => ({
    task: t, info: computeParentInfo(t.id),
  }));

  // ordina: chi ha una prossima data prima (crescente), gli altri sotto (per position)
  rootTasks.sort((a, b) => {
    const ad = a.info.nextDate, bd = b.info.nextDate;
    if (ad && bd) return ad.localeCompare(bd);
    if (ad && !bd) return -1;
    if (!ad && bd) return 1;
    return a.task.position - b.task.position;
  });

  listEl.innerHTML = '';

  if (rootTasks.length === 0) {
    listEl.innerHTML = '<div class="empty-state">Nessun task ancora. Aggiungine uno qui sotto.</div>';
    return;
  }

  for (const { task, info } of rootTasks) {
    listEl.appendChild(renderTaskCard(task, info));
  }
}

function renderTaskCard(task, info) {
  const card = document.createElement('div');
  card.className = 'task';
  const isOpen = expanded.has(task.id);
  const progressComplete = info.total > 0 && info.doneCount === info.total;

  const nextDateLabel = info.nextDate ? formatDate(info.nextDate) : (info.total > 0 ? 'senza data' : '—');
  const nextStepLabel = info.nextStep || '—';

  card.innerHTML = `
    <div class="task-row" data-toggle-expand="${task.id}">
      <span class="expand-arrow ${isOpen ? 'open' : ''}">▶</span>
      <div class="task-main">
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="task-line2">
          <span class="date-value ${!info.nextDate ? 'no-date' : ''}">${nextDateLabel}</span>
          <span class="progress-badge ${progressComplete ? 'complete' : ''}">${info.doneCount}/${info.total}</span>
          <button class="task-delete-btn" data-delete-task="${task.id}">${TRASH_SVG}</button>
        </div>
        ${info.total > 0 ? `<div class="task-line3">${escapeHtml(nextStepLabel)}</div>` : ''}
      </div>
    </div>
    ${isOpen ? renderSubtasksPanel(task.id) : ''}
  `;
  return card;
}

function renderSubtasksPanel(parentId) {
  const subs = orderSubtasks(getSubtasks(parentId));
  return `
    <div class="subtasks" data-subtasks-of="${parentId}">
      ${subs.map(s => renderSubtaskRow(s)).join('')}
      <button class="add-subtask-btn" data-add-sub="${parentId}">+ aggiungi sottotask</button>
    </div>
  `;
}

function renderSubtaskRow(sub) {
  const draggable = !sub.due_date; // trascinabili solo quelli senza data
  const dateLabel = sub.due_date ? formatDate(sub.due_date) : 'senza data';
  return `
    <div class="subtask-row ${draggable ? 'draggable' : ''}" data-subtask-id="${sub.id}" ${draggable ? 'draggable="true"' : ''}>
      ${draggable ? '<span class="drag-handle">⠿</span>' : ''}
      <div class="checkbox ${sub.done ? 'checked' : ''}" data-toggle-sub="${sub.id}"></div>
      <div class="subtask-body" data-edit-sub="${sub.id}">
        <div class="subtask-title ${sub.done ? 'done' : ''}">${escapeHtml(sub.title)}</div>
        <div class="subtask-meta">
          <span class="date-badge ${!sub.due_date ? 'empty' : ''}">${dateLabel}</span>
          <span class="chi-badge ${!sub.chi ? 'empty' : ''}">${sub.chi || '—'}</span>
        </div>
      </div>
      <button class="subtask-delete-btn" data-delete-task="${sub.id}">${TRASH_SVG}</button>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ================= EVENTI: espansione, checkbox, delete, drag =================

document.getElementById('taskList').addEventListener('click', (e) => {
  const expandId = e.target.closest('[data-toggle-expand]')?.dataset.toggleExpand;
  const toggleSubId = e.target.dataset.toggleSub;
  const deleteId = e.target.dataset.deleteTask;
  const addSubId = e.target.dataset.addSub;
  const editSubId = e.target.closest('[data-edit-sub]')?.dataset.editSub;

  if (toggleSubId) { toggleSubtaskDone(toggleSubId); return; }
  if (deleteId) { e.stopPropagation(); deleteTask(deleteId); return; }
  if (addSubId) { openSubtaskModal({ mode: 'new', parentId: addSubId }); return; }
  if (editSubId) { openSubtaskModal({ mode: 'edit', taskId: editSubId }); return; }
  if (expandId) {
    if (expanded.has(expandId)) expanded.delete(expandId); else expanded.add(expandId);
    render();
  }
});

// drag & drop per riordinare i sottotask senza data
document.getElementById('taskList').addEventListener('dragstart', (e) => {
  const row = e.target.closest('.subtask-row.draggable');
  if (!row) return;
  const panel = row.closest('[data-subtasks-of]');
  dragState = { parentId: panel.dataset.subtasksOf, draggedId: row.dataset.subtaskId };
  e.dataTransfer.effectAllowed = 'move';
});

document.getElementById('taskList').addEventListener('dragover', (e) => {
  const row = e.target.closest('.subtask-row.draggable');
  if (!row || !dragState) return;
  e.preventDefault();
  row.classList.add('drag-over');
});

document.getElementById('taskList').addEventListener('dragleave', (e) => {
  const row = e.target.closest('.subtask-row.draggable');
  if (row) row.classList.remove('drag-over');
});

document.getElementById('taskList').addEventListener('drop', (e) => {
  const row = e.target.closest('.subtask-row.draggable');
  if (!row || !dragState) return;
  e.preventDefault();
  row.classList.remove('drag-over');

  const targetId = row.dataset.subtaskId;
  if (targetId === dragState.draggedId) { dragState = null; return; }

  const subs = getSubtasks(dragState.parentId).filter(s => !s.due_date).sort((a, b) => a.position - b.position);
  const fromIdx = subs.findIndex(s => s.id === dragState.draggedId);
  const toIdx = subs.findIndex(s => s.id === targetId);
  if (fromIdx === -1 || toIdx === -1) { dragState = null; return; }

  const [moved] = subs.splice(fromIdx, 1);
  subs.splice(toIdx, 0, moved);
  subs.forEach((s, i) => {
    s.position = i;
    const t = tasks.find(x => x.id === s.id);
    if (t) t.position = i;
  });
  saveTasksToLocal();
  render();
  subs.forEach(s => saveTaskToDB(s));
  dragState = null;
});

// Composer per nuovi task principali
document.getElementById('composerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('composerInput');
  const title = input.value.trim();
  if (!title) return;
  if (!currentUser) { openAuthModal(); return; }
  addParentTask(title);
  input.value = '';
});

// ================= MODALE SOTTOTASK =================

function openSubtaskModal({ mode, parentId, taskId }) {
  subtaskModalContext = { mode, parentId, taskId, selectedChi: '' };
  const titleInput = document.getElementById('subtaskTitleInput');
  const dateInput = document.getElementById('subtaskDateInput');
  document.getElementById('subtaskModalTitle').textContent = mode === 'edit' ? 'Modifica sottotask' : 'Nuovo sottotask';

  if (mode === 'edit') {
    const t = tasks.find(x => x.id === taskId);
    titleInput.value = t?.title || '';
    dateInput.value = t?.due_date || '';
    subtaskModalContext.selectedChi = t?.chi || '';
    subtaskModalContext.parentId = t?.parent_id;
  } else {
    titleInput.value = '';
    dateInput.value = '';
  }
  updateChiButtons();
  document.getElementById('subtaskModalBackdrop').classList.remove('hidden');
  titleInput.focus();
}

function closeSubtaskModal() {
  document.getElementById('subtaskModalBackdrop').classList.add('hidden');
  subtaskModalContext = null;
}

function updateChiButtons() {
  document.querySelectorAll('#chiOptions button').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.chi === (subtaskModalContext?.selectedChi || ''));
  });
}

document.getElementById('chiOptions').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-chi]');
  if (!btn || !subtaskModalContext) return;
  subtaskModalContext.selectedChi = btn.dataset.chi;
  updateChiButtons();
});

document.getElementById('subtaskModalClose').addEventListener('click', closeSubtaskModal);

document.getElementById('subtaskSaveBtn').addEventListener('click', () => {
  if (!subtaskModalContext) return;
  const title = document.getElementById('subtaskTitleInput').value.trim();
  if (!title) return;
  const due_date = document.getElementById('subtaskDateInput').value || null;
  const chi = subtaskModalContext.selectedChi || null;

  if (subtaskModalContext.mode === 'edit') {
    addOrUpdateSubtask({ id: subtaskModalContext.taskId, title, due_date, chi });
  } else {
    addOrUpdateSubtask({ parentId: subtaskModalContext.parentId, title, due_date, chi });
    expanded.add(subtaskModalContext.parentId);
  }
  closeSubtaskModal();
  render();
});

// ================= AUTENTICAZIONE =================

function openAuthModal() {
  document.getElementById('authModalBackdrop').classList.remove('hidden');
  document.getElementById('authError').classList.remove('visible');
}
function closeAuthModal() { document.getElementById('authModalBackdrop').classList.add('hidden'); }

document.getElementById('userPill').addEventListener('click', () => {
  if (currentUser) openSettingsModal(); else openAuthModal();
});
document.getElementById('authModalClose').addEventListener('click', closeAuthModal);

document.getElementById('authToggleMode').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authModalTitle').textContent = authMode === 'login' ? 'Accedi' : 'Registrati';
  document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Accedi' : 'Registrati';
  document.getElementById('authToggleMode').textContent = authMode === 'login'
    ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi';
});

document.getElementById('authSubmitBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorEl = document.getElementById('authError');
  errorEl.classList.remove('visible');
  if (!email || !password) {
    errorEl.textContent = 'Inserisci email e password.';
    errorEl.classList.add('visible');
    return;
  }
  try {
    if (authMode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
    }
    closeAuthModal();
  } catch (err) {
    errorEl.textContent = err.message || 'Errore, riprova.';
    errorEl.classList.add('visible');
  }
});

function openSettingsModal() {
  document.getElementById('settingsEmail').textContent = currentUser?.email ?? '';
  updateSyncIndicator();
  document.getElementById('settingsModalBackdrop').classList.remove('hidden');
}
document.getElementById('settingsModalClose').addEventListener('click', () => {
  document.getElementById('settingsModalBackdrop').classList.add('hidden');
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  document.getElementById('settingsModalBackdrop').classList.add('hidden');
});

sb.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user ?? null;
  document.getElementById('userEmail').textContent = currentUser ? currentUser.email : 'accedi';
  if (currentUser) { fetchTasksFromDB(); flushPendingSync(); }
  else { tasks = []; render(); }
});

// ================= LIFECYCLE =================

window.addEventListener('online', flushPendingSync);
window.addEventListener('focus', flushPendingSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') flushPendingSync();
});
setInterval(() => { if (navigator.onLine) flushPendingSync(); }, 10000);

// ================= AVVIO =================

loadTasksFromLocal();
render();
updateSyncIndicator();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
